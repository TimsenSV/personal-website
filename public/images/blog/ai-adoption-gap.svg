<svg xmlns="http://www.w3.org/2000/svg" width="640" height="394" viewBox="0 0 640 394" role="img" aria-labelledby="title description">
  <title id="title">The adoption gap</title>
  <desc id="description">A conceptual sketch. Model capabilities curve up and off the chart while real-world adoption follows a straight, gradual climb.</desc>
  <defs>
    <clipPath id="paper"><rect x="1" y="1" width="638" height="392" rx="14"/></clipPath>
  </defs>

  <rect x="1" y="1" width="638" height="392" rx="14" fill="#faf8f2" stroke="#e6dfd1"/>
  <g clip-path="url(#paper)">
    <path d="M52 155H590 M52 232H590" stroke="#e8e1d3" stroke-dasharray="4 6"/>
    <path d="M52 96V354H590" fill="none" stroke="#c5b9a6" stroke-width="1.5"/>

    <path d="M56 294L590 204" fill="none" stroke="#a94d25" stroke-width="4" stroke-linecap="round"/>
    <path d="M56 294C147 270 255 243 318 200C390 152 440 83 460 -30" fill="none" stroke="#3159f5" stroke-width="5" stroke-linecap="round"/>

    <g fill="none" stroke="#a94d25" stroke-opacity=".55" stroke-width="1.5">
      <path d="M133 281V302 M285 255V275 M472 224V244"/>
    </g>
    <g fill="#faf8f2" stroke="#a94d25" stroke-width="3">
      <circle cx="133" cy="281" r="5"/>
      <circle cx="285" cy="255.4" r="5"/>
      <circle cx="472" cy="223.9" r="5"/>
    </g>

    <g font-family="DM Sans, system-ui, sans-serif">
      <text x="32" y="49" fill="#201e19" font-size="31" font-weight="700">The adoption gap</text>
      <text x="471" y="73" fill="#2648cd" font-size="23" font-weight="700">Model<tspan x="471" dy="25">capabilities</tspan></text>
      <text x="590" y="184" text-anchor="end" fill="#8d3d1c" font-size="23" font-weight="700">Real-world adoption</text>
      <g fill="#574638" font-size="22" text-anchor="middle">
        <text x="133" y="324">Added a<tspan x="133" dy="23">sparkle button</tspan></text>
        <text x="285" y="297">Legal wants<tspan x="285" dy="23">a pilot</tspan></text>
        <text x="472" y="266">Still exporting<tspan x="472" dy="23">CSVs</tspan></text>
      </g>
    </g>

    <g fill="#6f6253" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17">
      <text x="52" y="378">A very unscientific sketch</text>
      <text x="590" y="378" text-anchor="end">Time →</text>
    </g>
  </g>
</svg>
